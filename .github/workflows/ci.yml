name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Go Vet
        run: go vet ./...
      - name: Go Build
        run: go build -v ./...
      - name: Go Race Tests
        run: go test -v -race -count=1 ./...
      - name: Docker Build Check
        run: docker build -t relay-webhook-service:ci .
