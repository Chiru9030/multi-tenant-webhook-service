services:
  relay-webhook-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/chiru9030/multi-tenant-webhook-service:v1.0.0
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: "/app/data/webhooks.db"
      WEBHOOK_ADMIN_API_KEY: "${WEBHOOK_ADMIN_API_KEY:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8080}"
    ports:
      - "8080:8080"
    volumes:
      - relay_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  relay_data:
